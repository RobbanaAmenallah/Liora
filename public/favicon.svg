<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1830" />
      <stop offset="100%" stop-color="#070E1D" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#59D9C5" />
      <stop offset="100%" stop-color="#986DC7" />
    </linearGradient>
  </defs>

  <!-- Rounded Navy Badge -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Neural Network Synapses -->
  <g stroke-width="2.5" stroke-linecap="round">
    <line x1="17" y1="21" x2="32" y2="15" stroke="#59D9C5" stroke-opacity="0.85" />
    <line x1="17" y1="21" x2="32" y2="32" stroke="#59D9C5" stroke-opacity="0.85" />
    <line x1="17" y1="21" x2="32" y2="49" stroke="#986DC7" stroke-opacity="0.6" />

    <line x1="17" y1="43" x2="32" y2="15" stroke="#986DC7" stroke-opacity="0.6" />
    <line x1="17" y1="43" x2="32" y2="32" stroke="#59D9C5" stroke-opacity="0.85" />
    <line x1="17" y1="43" x2="32" y2="49" stroke="#59D9C5" stroke-opacity="0.85" />

    <line x1="32" y1="15" x2="48" y2="32" stroke="#59D9C5" stroke-opacity="0.9" />
    <line x1="32" y1="32" x2="48" y2="32" stroke="#FB923C" stroke-opacity="0.9" />
    <line x1="32" y1="49" x2="48" y2="32" stroke="#59D9C5" stroke-opacity="0.9" />
  </g>

  <!-- Input Nodes -->
  <circle cx="17" cy="21" r="4.5" fill="#0D1830" stroke="#38BDF8" stroke-width="2.8" />
  <circle cx="17" cy="43" r="4.5" fill="#0D1830" stroke="#38BDF8" stroke-width="2.8" />

  <!-- Hidden Layer Nodes -->
  <circle cx="32" cy="15" r="4.5" fill="#0D1830" stroke="#986DC7" stroke-width="2.8" />
  <circle cx="32" cy="32" r="5" fill="#0D1830" stroke="#59D9C5" stroke-width="2.8" />
  <circle cx="32" cy="49" r="4.5" fill="#0D1830" stroke="#986DC7" stroke-width="2.8" />

  <!-- Output Node -->
  <circle cx="48" cy="32" r="5.5" fill="#59D9C5" stroke="#0D1830" stroke-width="2" />
</svg>
